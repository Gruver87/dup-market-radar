name: ci-native

# Native parity job — runs on PRs and main (in addition to python-lab CI).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  native-parity:
    name: maturin + score parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Python deps + maturin
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest maturin
      - name: Build + install radar_native
        # maturin develop requires a venv; CI uses system pip → build wheel + install.
        run: |
          cd native/radar_native
          maturin build --release -o dist
          pip install dist/radar_native-*.whl
      - name: Parity tests (native prefer)
        env:
          PYTHONPATH: src
          RADAR_NATIVE_PREFER: "1"
          RADAR_NATIVE_FAIL_CLOSED: "1"
        run: |
          python -c "import radar_native; print('radar_native', radar_native.native_version())"
          python -m pytest tests/test_score_parity.py tests/test_non_crypto_fut.py -q --tb=short
