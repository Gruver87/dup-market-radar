name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # PROFILE: python-lab-only (RADAR_NATIVE_*=0). Native maturin job not in this workflow.
  test:
    name: test (python-lab-only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Profile honesty
        run: echo "CI profile=python-lab-only native prefer/fail_closed off"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Unit tests
        env:
          PYTHONPATH: src
          RADAR_NATIVE_PREFER: "0"
          RADAR_NATIVE_FAIL_CLOSED: "0"
        run: python -m pytest tests/ -q --tb=short

      - name: Offline smoke lab
        env:
          PYTHONPATH: src
          RADAR_NATIVE_PREFER: "0"
          RADAR_NATIVE_FAIL_CLOSED: "0"
        run: python scripts/radar_smoke_lab.py
