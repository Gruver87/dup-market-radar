# Live-money overlay — activate: RADAR_PROFILE=live-money
# Merged onto config/default.yaml. Requires .env keys (see docs/LIVE_MONEY.md).
# Futures NEVER in auto_trade.allowed_sectors (engine also hard-blocks FUTURES_BLOCK).
# Do NOT commit secrets. Lab default.yaml stays dry_run: true.

deployment_mode: prod

secrets:
  backend: env

native:
  prefer: true
  fail_closed: true

# API key gate is env: RADAR_API_KEY + RADAR_REQUIRE_API_KEY=1 (see go_live_money.ps1)
api:
  snapshot_require_api_key: true
  # Soft cap for manual + auto — must be >= quote_usdt_micros_per_buy
  max_order_quote_usdt_micros: 30000000   # 30 USDT (headroom over 25 USDT buys)

auto_trade:
  dry_run: false
  enabled_default: false                  # operator must flip Автоисполнение ON after dry cycle
  quote_usdt_micros_per_buy: 25000000     # 25 USDT
  max_open_positions: 4                   # hard cap on concurrent spot bags
  max_buys_per_cycle: 1
  max_sells_per_cycle: 3
  max_daily_buys: 12
  max_daily_notional_usdt_micros: 200000000  # 200 USDT/day
  signal_cooldown_sec: 900                # 15m same symbol+side
  min_score_centi: 4200                   # 42.00 — matches current board tops (~40–45)
  # Spot / CEX memes / listings only — never futures*
  allowed_sectors:
    - spot_alts
    - memes
    - listings
