# Live-money overlay — activate: RADAR_PROFILE=live-money
# Merged onto config/default.yaml. Requires .env keys (see docs/LIVE_MONEY.md).
# Futures NEVER in auto_trade.allowed_sectors (engine also hard-blocks FUTURES_BLOCK).
# Do NOT commit secrets. Lab default.yaml stays dry_run: true.
#
# 2026-11-21: shared_pool — one USDT cash pool, any spot/meme/listing buy up to max_open.
# No 1-position-per-sleeve lock (idle memes/listings cash can fund alts and vice versa).

deployment_mode: prod

secrets:
  backend: env

native:
  prefer: true
  fail_closed: true

# API key gate is env: RADAR_API_KEY + RADAR_REQUIRE_API_KEY=1 (see go_live_money.ps1)
api:
  snapshot_require_api_key: true
  # Hard ceiling per order (fat-finger only)
  max_order_quote_usdt_micros: 500000000   # 500 USDT

auto_trade:
  dry_run: false
  enabled_default: false                  # operator must flip Автоисполнение ON after dry cycle
  sizing_mode: shared_pool                # one free-USDT pool; buy best eligible across sectors
  quote_usdt_micros_per_buy: 15000000     # max ~15 USDT per buy (fair-share may be smaller)
  shared_pool_reserve_usdt_micros: 2000000  # keep ~2 USDT free on account
  max_open_positions: 4                   # still cap concurrent bags (risk)
  max_buys_per_cycle: 0                   # 0=unlimited this cycle (clearer picture)
  max_sells_per_cycle: 0                  # 0=unlimited this cycle
  max_daily_buys: 0                       # 0=unlimited daily buys
  max_daily_notional_usdt_micros: 0       # 0=unlimited daily notional
  signal_cooldown_sec: 600                # 10m same symbol+side
  cycle_sec: 45                           # tighter watch on open bags
  min_score_centi: 4500                   # 45.00 — stricter entries
  max_chase_change_bps_1h: 500            # skip buy if already +5% in 1h (no chase)
  fee_bps_per_side: 10                    # ~0.10% KuCoin taker; PnL net of round-trip
  loss_streak_pause_buys: 3               # after 3 losing sells → pause new buys
  loss_streak_pause_sec: 3600             # pause 1h (exits still run)
  stop_loss_bps: 1000                     # 10% hard stop
  take_profit_bps: 800                    # 8% hard TP (backup)
  # Freqtrade-style exits (learn from chop / fee drag — no profit guarantee)
  trailing_offset_bps: 300                # arm trail after +3%
  trailing_stop_bps: 200                  # sell on −2% from peak once armed
  fade_min_abs_bps: 100                   # ignore fade if |move| < 1% (fees)
  max_hold_sec: 14400                     # 4h force exit
  roi_ladder:                             # time-decay profit targets
    - after_sec: 0
      min_rise_bps: 400                   # +4% anytime
    - after_sec: 1800
      min_rise_bps: 200                   # +2% after 30m
    - after_sec: 5400
      min_rise_bps: 100                   # +1% after 90m
    - after_sec: 10800
      min_rise_bps: 0                     # breakeven after 3h
  exec_venues:
    - kucoin
  require_no_risk_flags: true
  spot_alts_soft_risk_flags:
    - wide_range_24h
    - vol_surge_1h
    - vol_dry_1h
    - below_vol_floor
    - mtf_proxy_ws_1m
    - mtf_diverge_1h
    - mtf_diverge_15m
    - mtf_diverge_5m
    - mtf_diverge_4h
    - wide_spread_*
  memes_soft_risk_flags:
    - below_vol_floor
    - wide_range_24h
    - vol_surge_1h
    - mtf_diverge_1h
    - mtf_diverge_15m
    - mtf_diverge_5m
    - mtf_diverge_4h
    - wide_spread_*
  listings_soft_risk_flags:
    - cross_venue_live
    - wide_range_24h
    - vol_surge_1h
    - mtf_diverge_1h
    - mtf_diverge_15m
    - wide_spread_*
  buy_setups:
    - buy-watch
    - new-listing-watch
    # long removed — was chasing already-extended moves on short cycle
  # Majors are long-horizon only — short radar cycle does not fit BTC/ETH.
  # Blacklist blocks auto buys; open bags still monitored for stop/TP/fade sells.
  symbol_blacklist:
    - BTCUSDT
    - ETHUSDT
  allowed_sectors:
    - spot_alts
    - memes
    - listings
