# Native fail-closed profile — requires Dockerfile.native build.
# Usage: docker compose -f docker-compose.native.yml up --build
# Secrets via .env — never baked into the image.
services:
  radar:
    build:
      context: .
      dockerfile: Dockerfile.native
    image: dup-market-radar:native
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      RADAR_NATIVE_PREFER: "1"
      RADAR_NATIVE_FAIL_CLOSED: "1"
      RADAR_REQUIRE_API_KEY: ${RADAR_REQUIRE_API_KEY:-1}
      RADAR_API_KEY: ${RADAR_API_KEY:-}
      # Native profile: snapshot/sector always require API key (ops exposure).
      RADAR_SNAPSHOT_REQUIRE_API_KEY: ${RADAR_SNAPSHOT_REQUIRE_API_KEY:-1}
      RADAR_WEBHOOK_URL: ${RADAR_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      KUCOIN_API_KEY: ${KUCOIN_API_KEY:-}
      KUCOIN_API_SECRET: ${KUCOIN_API_SECRET:-}
      KUCOIN_API_PASSPHRASE: ${KUCOIN_API_PASSPHRASE:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped
