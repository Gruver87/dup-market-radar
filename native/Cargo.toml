[workspace]
resolver = "2"
members = [
    "radar_core",
    "radar_ingest",
    "radar_native",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["DUP Labs"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
