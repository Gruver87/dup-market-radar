// Minimal MEXC spot aggre-deals push — field numbers match mexcdevelop/websocket-proto.
syntax = "proto3";
package mexc;

message PublicAggreDealsV3ApiItem {
  string price = 1;
  string quantity = 2;
  int32 trade_type = 3;
  int64 time = 4;
  string trade_id = 5;
}

message PublicAggreDealsV3Api {
  repeated PublicAggreDealsV3ApiItem deals = 1;
  string event_type = 2;
}

message PushDataV3ApiWrapper {
  string channel = 1;
  oneof body {
    PublicAggreDealsV3Api public_aggre_deals = 314;
  }
  optional string symbol = 3;
  optional string symbol_id = 4;
  optional int64 create_time = 5;
  optional int64 send_time = 6;
}
