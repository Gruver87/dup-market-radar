[package]
name = "radar_native"
version = "0.2.104"
edition.workspace = true
description = "DUP Market Radar hot path — scoring/ranking (Python orchestration + Rust native)"
license.workspace = true

[lib]
name = "radar_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
auto-initialize = ["pyo3/auto-initialize"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Shared money/tick types (score still local; ingest uses radar_core directly)
radar_core = { path = "../radar_core" }
