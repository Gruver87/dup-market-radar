[package]
name = "radar_native"
version = "0.2.72"
edition = "2021"
description = "DUP Market Radar hot path — scoring/ranking (Python orchestration + Rust native)"

[lib]
name = "radar_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
auto-initialize = ["pyo3/auto-initialize"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
