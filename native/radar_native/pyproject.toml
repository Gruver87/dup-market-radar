[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "radar_native"
version = "0.2.68"
requires-python = ">=3.11"
description = "DUP Market Radar Rust hot path (PyO3)"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "radar_native"
features = ["pyo3/extension-module"]
