[project]
name = "dup-market-radar"
version = "0.2.75"
description = "DUP Market Radar — hybrid Python+Rust market analyzer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Phase-1 CI gate: correctness (unused/undefined). Style UP/I deferred.
select = ["E", "F"]
ignore = [
  "E501",  # line length — industrial logs/messages stay readable
]

# Native crate lives under native/radar_native (maturin develop).
# Pattern mirrors abs_native on dup-protocol-experimental.
